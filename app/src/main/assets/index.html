<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMS Scout</title>
<style>
:root{
  --navy:#0d2352; --orange:#e85d04; --orange-soft:#fdebdd;
  --bg:#f3f5f9; --card:#fff; --ink:#1a2233; --mut:#67718a; --line:#e3e7ef;
  --ok:#1a7f4e; --warn:#b97708; --bad:#b3362c; --info:#2a5bd7;
}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px 12px}
header h1{font-size:17px;font-weight:800}
header h1 b{color:var(--orange)}
header .sub{font-size:11px;color:#aab6d4}
.search-row{display:flex;gap:8px;margin-top:10px}
.search-row input{flex:1;border:0;border-radius:10px;padding:11px 13px;font-size:15px}
.search-row input:focus{outline:3px solid var(--orange)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid #3a4f8d;background:transparent;color:#cdd6ec;border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
main{padding:12px 12px 0;max-width:760px;margin:0 auto}
.counter{font-size:12px;color:var(--mut);margin:2px 2px 8px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:13px 13px 13px 19px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--st,#8b93a8)}
.card[data-st="Новий"]{--st:#8b93a8}
.card[data-st="В роботі"]{--st:var(--info)}
.card[data-st="Зацікавлені"]{--st:var(--ok)}
.card[data-st="Передано керівництву"]{--st:var(--navy)}
.card[data-st="Відмова"]{--st:var(--bad)}
.card[data-st="Не додзвонились"]{--st:var(--warn)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h2{font-size:15.5px;font-weight:800;line-height:1.25}
.card .cat{font-size:11px;color:var(--mut);margin-top:2px}
.badge{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#fff;color:var(--st);border:1px solid var(--st)}
.edr{font-size:12.5px;color:var(--mut);margin-top:6px}
.edr .v0{color:var(--warn);font-weight:700}
.contact-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.act{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;font-weight:700;border-radius:9px;padding:8px 12px;border:1px solid var(--line);color:var(--navy);background:#f7f9fc}
.act.call{background:var(--ok);border-color:var(--ok);color:#fff}
.act.mail{background:var(--navy);border-color:var(--navy);color:#fff}
.act.more{background:var(--orange-soft);border-color:#f4c9a4;color:var(--orange)}
.detail{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.card.open .detail{display:block}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.links a{font-size:12.5px;text-decoration:none;color:var(--navy);background:#eef2fa;border:1px solid #dbe3f3;border-radius:8px;padding:7px 10px;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .full{grid-column:1/-1}
label.f{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:3px;text-transform:uppercase}
.f-in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;background:#fff;color:var(--ink)}
.f-in:focus{outline:2px solid var(--orange)}
textarea.f-in{min-height:64px}
.row-btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:800}
.btn.save{background:var(--orange);color:#fff}
.btn.del{background:#fff;color:var(--bad);border:1px solid #ecc9c5}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.bottombar .btn{flex:1}
.btn.add{background:var(--orange);color:#fff}
.btn.imp{background:#eef2fa;color:var(--navy)}
.btn.exp{background:var(--navy);color:#fff}
dialog{border:0;border-radius:14px;padding:16px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(13,35,82,.5)}
dialog h3{font-size:16px;margin-bottom:10px;color:var(--navy)}
dialog .hint{font-size:12px;color:var(--mut);margin:6px 0 10px}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>DMS&nbsp;<b>Scout</b></h1>
  <div class="sub">UNIVERSALNA · контакти для корпоративного ДМС · офлайн</div>
  <div class="search-row"><input id="q" type="search" placeholder="Пошук: назва або ЄДРПОУ…"></div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="counter" id="counter"></div>
  <div id="list"></div>
</main>
<div class="bottombar">
  <button class="btn add" onclick="dlgAdd.showModal()">+ Компанія</button>
  <button class="btn imp" onclick="dlgImp.showModal()">Імпорт CSV</button>
  <button class="btn exp" onclick="exportCsv()">Експорт</button>
</div>

<dialog id="dlgAdd">
  <h3>Нова компанія</h3>
  <label class="f">Назва</label><input class="f-in" id="addName">
  <label class="f" style="margin-top:8px">ЄДРПОУ</label><input class="f-in mono" id="addEdr" inputmode="numeric">
  <div class="row-btns"><button class="btn save" onclick="addOne()">Додати</button>
  <button class="btn del" onclick="dlgAdd.close()">Скасувати</button></div>
</dialog>

<dialog id="dlgImp">
  <h3>Імпорт CSV</h3>
  <div class="hint">Формат (з заголовком або без):<br>
  <span class="mono">edrpou,name,phone,email,address</span><br>
  Зайві колонки ігноруються. Якщо ЄДРПОУ вже є в списку — контакти додаються до існуючої картки, нові компанії створюються.</div>
  <input class="f-in" type="file" id="impFile" accept=".csv,text/csv,text/plain">
  <div class="row-btns"><button class="btn save" onclick="doImport()">Імпортувати</button>
  <button class="btn del" onclick="dlgImp.close()">Скасувати</button></div>
</dialog>

const esc = s => (s??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const qq = s => encodeURIComponent(s||"");

function load(){
  const raw = localStorage.getItem(KEY);
  if(raw){ try{ DATA = JSON.parse(raw); }catch(e){ DATA = []; } }
  if(!DATA.length){
    DATA = SEED.map((r,i)=>({id:i+1, category:r[0], name:r[1], official_name:r[2], edrpou:r[3],
      edrpou_verified:0, website:r[4], phone:"", email:"", contact_person:"",
      linkedin:"", facebook:"", status:"Новий", notes:""}));
    persist();
  }
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(DATA)); }
function nextId(){ return DATA.reduce((m,c)=>Math.max(m,c.id),0)+1; }

function buildLinks(c){
  const n = qq(c.name), L = [];
  if(c.website){
    let s = c.website.split(";")[0].trim();
    if(s && !s.startsWith("http")) s = "https://" + s;
    if(s){ L.push(["Сайт", s]); L.push(["Сайт: контакти", s.replace(/\/$/,"") + "/contacts"]); }
  }
  if(c.edrpou && /^\d+$/.test(c.edrpou)){
    L.push(["YouControl", "https://youcontrol.com.ua/catalog/company_details/"+c.edrpou+"/"]);
    L.push(["OpenDataBot", "https://opendatabot.ua/c/"+c.edrpou]);
    L.push(["Clarity Project", "https://clarity-project.info/edr/"+c.edrpou]);
    L.push(["Ring (Bihus)", "https://ring.org.ua/search?q="+c.edrpou]);
  } else {
    L.push(["YouControl", "https://youcontrol.com.ua/search/?q="+n]);
    L.push(["Ring (Bihus)", "https://ring.org.ua/search?q="+n]);
  }
  L.push(["Google: контакти", "https://www.google.com/search?q="+n+"+%D0%BA%D0%BE%D0%BD%D1%82%D0%B0%D0%BA%D1%82%D0%B8"]);
  L.push(["LinkedIn", "https://www.linkedin.com/search/results/companies/?keywords="+n]);
  L.push(["Facebook", "https://www.facebook.com/search/pages/?q="+n]);
  L.push(["robota.ua", "https://robota.ua/zapros/"+n+"/ukraine"]);
  L.push(["DOU", "https://jobs.dou.ua/companies/?search="+n]);
  return L;
}

function render(){
  const chips = document.getElementById("chips");
  if(!chips.childElementCount){
    chips.innerHTML = `<button class="chip on" data-f="">Всі</button>` +
      STATUSES.map(s=>`<button class="chip" data-f="${s}">${s}</button>`).join("");
  }
  const q = QUERY.toLowerCase();
  const rows = DATA.filter(c =>
    (!FILTER || c.status===FILTER) &&
    (!q || c.name.toLowerCase().includes(q) || (c.edrpou||"").includes(q) || (c.official_name||"").toLowerCase().includes(q)));
  document.getElementById("counter").textContent = rows.length + " із " + DATA.length + " компаній";
  const list = document.getElementById("list");
  if(!rows.length){ list.innerHTML = `<div class="empty">Нічого не знайдено.</div>`; return; }
  list.innerHTML = rows.map(card).join("");
}

function card(c){
  const edr = c.edrpou
    ? `<span class="mono">${esc(c.edrpou)}</span>${c.edrpou_verified?"":" <span class=\"v0\">⚠ перевірити</span>"}`
    : "<i>ЄДРПОУ не вказано</i>";
  const tel = (c.phone||"").split(/[;,]/)[0].trim();
  const mail = (c.email||"").split(/[;,]/)[0].trim();
  const links = buildLinks(c).map(([l,u])=>`<a href="${esc(u)}">${esc(l)} ↗</a>`).join("");
  return `<article class="card" data-st="${esc(c.status)}" id="c${c.id}">
    <div class="top"><div><h2>${esc(c.name)}</h2><div class="cat">${esc(c.category||"")}</div></div>
    <span class="badge">${esc(c.status)}</span></div>
    <div class="edr">${esc(c.official_name||"")} · ЄДРПОУ ${edr}</div>
    <div class="contact-line">
      ${tel?`<a class="act call" href="tel:${esc(tel.replace(/[^+\d]/g,""))}">📞 ${esc(tel)}</a>`:""}
      ${mail?`<a class="act mail" href="mailto:${esc(mail)}">✉ ${esc(mail)}</a>`:""}
      <button class="act more" onclick="toggle(${c.id})">Картка ▾</button>
    </div>
    <div class="detail">
      <div class="links">${links}</div>
      <div class="fgrid">
        <div><label class="f">Телефон</label><input class="f-in mono" data-k="phone" value="${esc(c.phone)}"></div>
        <div><label class="f">Email</label><input class="f-in" data-k="email" value="${esc(c.email)}"></div>
        <div><label class="f">Контактна особа</label><input class="f-in" data-k="contact_person" value="${esc(c.contact_person)}"></div>
        <div><label class="f">Статус</label><select class="f-in" data-k="status">${STATUSES.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></div>
        <div><label class="f">LinkedIn</label><input class="f-in" data-k="linkedin" value="${esc(c.linkedin)}"></div>
        <div><label class="f">Facebook</label><input class="f-in" data-k="facebook" value="${esc(c.facebook)}"></div>
        <div><label class="f">ЄДРПОУ</label><input class="f-in mono" data-k="edrpou" value="${esc(c.edrpou)}"></div>
        <div><label class="f">ЄДРПОУ перевірено</label><select class="f-in" data-k="edrpou_verified"><option value="0" ${!c.edrpou_verified?"selected":""}>ні</option><option value="1" ${c.edrpou_verified?"selected":""}>так</option></select></div>
        <div class="full"><label class="f">Нотатки</label><textarea class="f-in" data-k="notes">${esc(c.notes)}</textarea></div>
      </div>
      <div class="row-btns">
        <button class="btn save" onclick="save(${c.id})">Зберегти</button>
        <button class="btn del" onclick="del(${c.id})">Видалити</button>
      </div>
    </div>
  </article>`;
}

function toggle(id){ document.getElementById("c"+id).classList.toggle("open"); }

function save(id){
  const el = document.getElementById("c"+id);
  const c = DATA.find(x=>x.id===id);
  el.querySelectorAll("[data-k]").forEach(i => c[i.dataset.k] = i.dataset.k==="edrpou_verified" ? +i.value : i.value);
  persist(); render();
}

function del(id){
  if(!confirm("Видалити компанію зі списку?")) return;
  DATA = DATA.filter(c=>c.id!==id); persist(); render();
}

function addOne(){
  const name = document.getElementById("addName").value.trim();
  if(!name) return;
  DATA.unshift({id:nextId(), category:"", name, official_name:"", edrpou:document.getElementById("addEdr").value.trim(),
    edrpou_verified:0, website:"", phone:"", email:"", contact_person:"", linkedin:"", facebook:"", status:"Новий", notes:""});
  persist(); dlgAdd.close();
  document.getElementById("addName").value=""; document.getElementById("addEdr").value="";
  render();
}

/* ---- CSV ---- */
function parseCsvLine(line){
  const out = []; let cur = "", inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    } else if(ch==='"') inQ=true;
    else if(ch===','){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur);
  return out;
}

function doImport(){
  const f = document.getElementById("impFile").files[0];
  if(!f){ alert("Обери файл"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split(/\r?\n/).filter(l=>l.trim());
    let cols = ["edrpou","name","phone","email","address"];
    let start = 0;
    const head = parseCsvLine(lines[0]).map(s=>s.trim().toLowerCase());
    if(head.includes("edrpou") || head.includes("name") || head.includes("єдрпоу") || head.includes("назва")){
      cols = head.map(h => ({"єдрпоу":"edrpou","назва":"name","телефон":"phone","пошта":"email","адреса":"address"}[h] || h));
      start = 1;
    }
    let created=0, updated=0;
    for(let i=start;i<lines.length;i++){
      const vals = parseCsvLine(lines[i]);
      const rec = {};
      cols.forEach((cName,j)=> rec[cName] = (vals[j]||"").trim());
      if(!rec.edrpou && !rec.name) continue;
      const existing = rec.edrpou ? DATA.find(c=>c.edrpou===rec.edrpou) : null;
      if(existing){
        if(rec.phone && !existing.phone.includes(rec.phone)) existing.phone = existing.phone ? existing.phone+"; "+rec.phone : rec.phone;
        if(rec.email && !existing.email.includes(rec.email)) existing.email = existing.email ? existing.email+"; "+rec.email : rec.email;
        if(rec.address && !existing.notes.includes(rec.address)) existing.notes = (existing.notes?existing.notes+"\n":"")+"Адреса (ЄДР): "+rec.address;
        if(rec.name && !existing.official_name) existing.official_name = rec.name;
        existing.edrpou_verified = 1; // дані з реєстру = ЄДРПОУ підтверджений
        updated++;
      } else {
        DATA.push({id:nextId(), category:"Імпорт", name:rec.name||("ЄДРПОУ "+rec.edrpou),
          official_name:rec.name||"", edrpou:rec.edrpou||"", edrpou_verified:rec.edrpou?1:0,
          website:rec.website||"", phone:rec.phone||"", email:rec.email||"",
          contact_person:"", linkedin:"", facebook:"", status:"Новий",
          notes:rec.address?("Адреса (ЄДР): "+rec.address):""});
        created++;
      }
    }
    persist(); render(); dlgImp.close();
    alert("Оновлено: "+updated+", створено: "+created);
  };
  reader.readAsText(f, "utf-8");
}

function csvCell(v){
  v = (v??"").toString();
  return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}

function exportCsv(){
  const cols = ["name","official_name","edrpou","category","website","phone","email","contact_person","linkedin","facebook","status","notes"];
  const head = "Назва,Офіційна назва,ЄДРПОУ,Категорія,Сайт,Телефон,Email,Контактна особа,LinkedIn,Facebook,Статус,Нотатки";
  const body = DATA.map(c => cols.map(k=>csvCell(c[k])).join(",")).join("\n");
  const csv = "\uFEFF" + head + "\n" + body;   // BOM, щоб Excel відкрив кирилицю
  const name = "dms_outreach_" + new Date().toISOString().slice(0,10) + ".csv";
  if(window.Android && Android.saveFile){ Android.saveFile(name, csv); }
  else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = name; a.click();
  }
}

document.getElementById("q").addEventListener("input", e => { QUERY=e.target.value; render(); });
document.getElementById("chips").addEventListener("click", e => {
  if(!e.target.classList.contains("chip")) return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  e.target.classList.add("on"); FILTER = e.target.dataset.f; render();
});
load(); render();
