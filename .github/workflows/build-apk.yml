name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Прибираємо попередження про Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 6000 build.log 2>/dev/null || echo "немає build.log")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build failed: run $GITHUB_RUN_ID" \
            --body "\`\`\`
          $TAIL
          \`\`\`"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dms-scout-debug-apk
          # Шукає всі .apk файли в усіх підпапках проєкту
          path: "**/*.apk"
