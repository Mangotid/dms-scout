name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Прибираємо попередження про Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        # Без tee: якщо Gradle впаде, крок стане червоним і покаже реальну помилку
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK (Debug info)
        # Виведе в лог точне місцезнаходження зібраного файлу
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dms-scout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
